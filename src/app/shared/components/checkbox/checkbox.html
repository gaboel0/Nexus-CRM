<label
  class="flex cursor-pointer items-start gap-3"
  [class.cursor-not-allowed]="isDisabled()"
  [class.opacity-60]="isDisabled()"
>
  <span class="relative mt-0.5 inline-flex size-4 shrink-0">
    <input
      type="checkbox"
      class="peer size-4 cursor-pointer appearance-none rounded border border-crm-border bg-crm-surface outline-none transition-colors checked:border-crm-primary checked:bg-crm-primary focus:shadow-crm-focus disabled:cursor-not-allowed"
      [checked]="value()"
      [disabled]="isDisabled()"
      (change)="onToggle($event)"
      (blur)="markTouched()"
    />
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="pointer-events-none absolute inset-0 m-auto size-3 text-white opacity-0 peer-checked:opacity-100"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </span>

  <span class="flex flex-col">
    <span class="text-sm font-medium text-crm-text">{{ label() }}</span>
    @if (description()) {
      <span class="mt-0.5 text-xs text-crm-muted">{{ description() }}</span>
    }
  </span>
</label>
