@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center"
    [class]="overlayClasses()"
    (click)="closed.emit()"
  >
    <div
      #dialog
      role="dialog"
      [attr.aria-modal]="isModal() ? 'true' : 'false'"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      [class]="dialogClasses()"
      (click)="$event.stopPropagation()"
      (keydown)="onDialogKeydown($event)"
    >
      @if (placement() === 'center') {
        <div class="mb-4 flex items-start justify-between gap-4">
          <h2 [attr.id]="titleId" class="text-lg font-semibold text-crm-text">{{ title() }}</h2>
          <button
            type="button"
            aria-label="Fechar"
            class="flex size-8 shrink-0 items-center justify-center rounded-md text-crm-muted cursor-pointer outline-none transition-colors hover:bg-crm-canvas hover:text-crm-text focus-visible:shadow-crm-focus"
            (click)="closed.emit()"
          >
            <app-icon name="close" />
          </button>
        </div>
      } @else {
        <!-- Painel: o conteúdo traz o próprio cabeçalho; o título fica só para leitores de tela. -->
        <h2 [attr.id]="titleId" class="sr-only">{{ title() }}</h2>
      }

      <ng-content />
    </div>
  </div>
}
