<router-outlet />

<!-- Botão de tema fixo em todas as telas. Fica abaixo dos modais (z-40 < z-50). -->
<app-button
  class="fixed top-4 right-4 z-40"
  [variant]="toggleVariant()"
  [iconOnly]="true"
  [ariaLabel]="toggleLabel()"
  (click)="toggleTheme()"
>
  <app-icon [name]="isDark() ? 'light_mode' : 'dark_mode'" />
</app-button>
